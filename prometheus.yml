global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  ## Added custom python exporter running on 8000
  - job_name: 'custom_postgres_exporter'
    static_configs:
      - targets: ["web:8000"]
      #- targets: ["17x.x.x.x:8000"]

